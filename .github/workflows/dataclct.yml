name: Docker Hub CI/CD to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image name (strips hidden spaces/newlines from secret)
        run: |
          USER_CLEAN=$(printf '%s' "${{ secrets.DOCKER_HUB_USER }}" | tr -d '[:space:]')
          echo "IMAGE=${USER_CLEAN}/myapp" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}          
          script: |
            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            docker stop myapp 2>/dev/null || true
            docker rm myapp 2>/dev/null || true

            docker run -d \
              --name myapp \
              --restart unless-stopped \
              -p 5000:5000 \
              ${{ env.IMAGE }}:${{ github.sha }}

            sleep 5
            if ! docker ps --filter "name=myapp" --filter "status=running" | grep -q myapp; then
              echo "Container failed to start. Logs:"
              docker logs myapp || true
              exit 1
            fi

            docker image prune -f
            docker ps
